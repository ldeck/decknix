name: Documentation

# Build and check on every PR so stale or broken docs are caught before merge;
# deploy only from main.
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'modules/**'
      - 'lib/**'
      - 'cli/**'
      - 'README.md'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'modules/**'
      - 'lib/**'
      - 'cli/**'
      - 'README.md'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      # Options come from evaluating the real module tree against the flake's
      # pinned nixpkgs (docs/generate-options.nix), not a channel, so the
      # reference matches what users actually get.
      - name: Generate options JSON and check coverage
        run: |
          mkdir -p docs/src/data
          release=$(nix eval --raw --impure --expr \
            '(builtins.getFlake (toString ./.)).inputs.nixpkgs.lib.trivial.release')
          nix build -L .#checks.x86_64-linux.docs-options-coverage
          cat result
          nix build -L .#docs-options -o options-json
          cp options-json "docs/src/data/options-$release.json"
          # Older org hub pages still request the channel names this site
          # used to publish; serve them the pinned set rather than a 404.
          cp options-json docs/src/data/options-unstable.json
          cp options-json docs/src/data/options-24.11.json
          grep -q "value=\"$release\"" docs/src/hub.md || {
            echo "docs/src/hub.md channel selector does not offer nixpkgs $release" >&2
            exit 1
          }

      - name: Build documentation
        run: nix run --inputs-from . nixpkgs#mdbook -- build docs

      # Internal links and anchors must resolve offline; external links are
      # checked too, because a broken install URL is exactly what users hit
      # first. Rate-limited and auth-walled hosts are excluded in
      # docs/lychee.toml.
      - name: Check links
        run: |
          nix run --inputs-from . nixpkgs#lychee -- \
            --config docs/lychee.toml \
            --root-dir "$PWD/docs/book" \
            docs/book README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
